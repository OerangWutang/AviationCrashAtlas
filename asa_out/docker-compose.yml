# Aviation Safety Atlas — full local development stack
#
# Usage:
#   docker compose up            # start all services
#   docker compose up -d         # start in background
#   docker compose down -v       # stop and remove containers + volumes
#
# First-time setup (runs automatically):
#   atlas db migrate  →  atlas db seed
#
# Then optionally:
#   docker compose exec api atlas ingest csv /data/ntsb_sample.csv
#   docker compose exec api atlas keys create reviewer@example.com
#
# API:       http://localhost:8000
# API docs:  http://localhost:8000/docs
# Frontend:  http://localhost:3000

services:

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis for rate limiting / production-parity local runs ───────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Migrations + seed (run once, exit) ───────────────────────────────────
  migrate:
    build: .
    command: sh -c "atlas db migrate && atlas db seed"
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@db:5432/atlas
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── FastAPI backend ───────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    command: atlas serve
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@db:5432/atlas
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_AUTH_ENABLED: "false"          # set to "true" in production
      LOG_LEVEL: INFO
      LOG_FORMAT: console
      CORS_ORIGINS: "http://localhost:3000"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./tests/fixtures:/data:ro        # sample CSVs for ingest commands
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Next.js frontend ──────────────────────────────────────────────────────
  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci --prefer-offline && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  web_node_modules:
