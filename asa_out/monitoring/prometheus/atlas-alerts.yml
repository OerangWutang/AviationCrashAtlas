groups:
  - name: aviation-safety-atlas-api
    rules:
      - alert: AtlasApiDown
        expr: up{job="aviation-safety-atlas"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Aviation Safety Atlas API is down"
          description: "Prometheus has not been able to scrape the Atlas API for at least 2 minutes."

      - alert: AtlasHigh5xxRate
        expr: |
          (
            sum(rate(atlas_http_requests_total{job="aviation-safety-atlas",status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(atlas_http_requests_total{job="aviation-safety-atlas"}[5m])), 0.001)
          ) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Aviation Safety Atlas high 5xx rate"
          description: "More than 2% of Atlas API requests have returned 5xx for 10 minutes."

      - alert: AtlasHighRequestLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(atlas_http_request_duration_seconds_bucket{job="aviation-safety-atlas"}[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Aviation Safety Atlas p95 latency is high"
          description: "p95 request latency has been above 2 seconds for 10 minutes."

      - alert: AtlasInFlightRequestsHigh
        expr: avg_over_time(atlas_http_requests_in_flight{job="aviation-safety-atlas"}[10m]) > 25
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Aviation Safety Atlas in-flight request buildup"
          description: "In-flight request count has remained elevated for 10 minutes. Tune the threshold for deployment size."

      - alert: AtlasMapTruncationSpike
        expr: sum(rate(atlas_map_truncation_total{job="aviation-safety-atlas"}[15m])) > 0.1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Aviation Safety Atlas map responses are frequently truncated"
          description: "Map responses are repeatedly hitting MAX_MAP_RESULTS. Check viewport bounds, clustering, and client filters."

      - alert: AtlasProvenanceTruncationSpike
        expr: sum(rate(atlas_provenance_truncation_total{job="aviation-safety-atlas"}[15m])) > 0.05
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Aviation Safety Atlas provenance responses are frequently truncated"
          description: "Provenance sections are repeatedly hitting caps. Investigate contested events, duplicate ingestion, or need for pagination/export."

      - alert: AtlasProjectionRebuildFailures
        expr: sum(rate(atlas_projection_rebuilds_total{job="aviation-safety-atlas",outcome="error"}[10m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Aviation Safety Atlas projection rebuild failures"
          description: "At least one API-triggered projection rebuild failed in the last 10 minutes. Conflict resolution may be partially blocked."


      - alert: AtlasIngestionStale
        expr: (time() - max(atlas_ingestion_last_success_timestamp_seconds{job="aviation-safety-atlas"})) > 86400
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Aviation Safety Atlas ingestion appears stale"
          description: "No successful ingestion timestamp has been observed within the last 24 hours. Tune this threshold per source cadence."

      - alert: AtlasConflictBacklogTooOld
        expr: atlas_conflicts_oldest_open_age_seconds{job="aviation-safety-atlas"} > 604800
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Aviation Safety Atlas has old unresolved conflicts"
          description: "The oldest open conflict is older than 7 days. Review backlog may be blocking trustworthy projections."

      - alert: AtlasConflictBacklogLarge
        expr: atlas_conflicts_open_total{job="aviation-safety-atlas"} > 500
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Aviation Safety Atlas conflict backlog is large"
          description: "Open conflict count is above the configured threshold. Tune this for team capacity."

      - alert: AtlasDuplicateCandidateBacklogLarge
        expr: atlas_duplicate_candidates_pending_total{job="aviation-safety-atlas"} > 500
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Aviation Safety Atlas duplicate candidate backlog is large"
          description: "Pending duplicate candidates have exceeded the review threshold."

      - alert: AtlasDataQualityIssuesOpen
        expr: sum(atlas_data_quality_issues_open_total{job="aviation-safety-atlas"}) > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Aviation Safety Atlas has open data-quality issues"
          description: "Open data-quality warnings exist, such as crew/passenger split totals not matching aggregate totals."

      - alert: AtlasNoConflictResolutionRecently
        expr: sum(increase(atlas_conflict_resolutions_total{job="aviation-safety-atlas"}[7d])) == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "No Atlas conflict resolutions in the last 7 days"
          description: "Optional workflow alert. Enable only if the review team is expected to resolve conflicts weekly."

  - name: aviation-safety-atlas-blackbox
    rules:
      - alert: AtlasReadinessProbeFailing
        expr: probe_success{job="atlas-readyz"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Aviation Safety Atlas readiness probe is failing"
          description: "The blackbox readiness probe failed. Check /api/v1/readyz for database, migration, source seed, and Redis status."
