[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-safety-atlas"
version = "0.1.0"
description = "Aviation Safety Atlas — claim-based aviation accident platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dateutil>=2.9.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.4",
    "structlog>=24.1.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "python-ulid>=2.0.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "pip-tools>=7.4.0",
]

[project.scripts]
atlas = "atlas.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "integration: tests that require PostgreSQL/PostGIS and optional Redis",
    "performance: generated fixture/performance smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — long lines in ORM/engine are acceptable
    "E701",   # single-line if — used intentionally in filter chains
    "E702",   # multiple statements on one line (semicolon) — compact Pydantic models
    "B008",   # Depends() in default — standard FastAPI pattern, not a real issue
    "E402",   # module-level import not at top — tests use sectioned mid-file imports
    "UP042",  # str+Enum — StrEnum requires Python 3.11+, keeping explicit for compatibility
]
